<script>
/* ============ engine ============ */
/* ---- engine/format.js ---- */
(function () {
/*
 * format.js - engineering notation shared by every bench.
 *
 * toPrecision flips to exponential once the exponent reaches the precision,
 * turning 197.3 into "2.0e+2". Round-tripping through Number() avoids that,
 * so an axis label reads "197 mA" rather than scientific notation.
 */

const SI_PREFIXES = [
  [1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''],
  [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']
];

/** Trim a number to `sig` significant figures without exponential notation. */
const trim = (x, sig) => String(Number(x.toPrecision(sig || 4)));

/** Round to 4 s.f. so the displayed value, the formula and the netlist agree exactly. */
const round4 = v => parseFloat(v.toPrecision(4));

/** 0.0001414 -> "141.4 uF". Pass a unit, get a unit. */
function eng(x, unit, sig) {
  sig = sig || 4;
  unit = unit || '';
  if (!isFinite(x)) return '—';
  if (x === 0) return '0 ' + unit;
  const sign = x < 0 ? '-' : '', a = Math.abs(x);
  for (const [mul, pre] of SI_PREFIXES) {
    if (a >= mul) return sign + trim(a / mul, sig) + ' ' + pre + unit;
  }
  return sign + trim(a / 1e-12, sig) + ' p' + unit;
}

/** Same value with a bare SI suffix, the way you would type it into a netlist. */
function sci(v) {
  const a = Math.abs(v);
  for (const [mul, pre] of SI_PREFIXES) {
    if (a >= mul) return trim(v / mul, 4) + (pre === 'µ' ? 'u' : pre);
  }
  return String(v);
}

/** Slider position 0..1000 mapped logarithmically onto [lo, hi]. */
const logMap = (t, [lo, hi]) => lo * Math.pow(hi / lo, t / 1000);
const logUnmap = (v, [lo, hi]) => 1000 * Math.log(v / lo) / Math.log(hi / lo);

const API = { eng, sci, trim, round4, logMap, logUnmap, SI_PREFIXES };
if (typeof window !== 'undefined') window.Fmt = API;
})();

/* ---- engine/mna.js ---- */
(function () {
/*
 * mna.js - complex-domain modified nodal analysis for small linear circuits.
 *
 * No dependencies; runs unchanged in Node and in the browser. The point of
 * this file is that every linear circuit in the RSGB syllabus - potential
 * dividers, CR and LR filters, series and parallel resonance, matching
 * networks - is the same calculation. Write the netlist, sweep the frequency,
 * read the answer. There is no per-circuit maths anywhere above this layer.
 *
 * Netlist syntax (one element per line, '*', ';' or '#' starts a comment):
 *
 *     V1 in 0  1        ; source, 1 V, node 'in' positive w.r.t. ground
 *     R1 in a  5        ; 5 ohms between 'in' and 'a'
 *     G1 c e b e 0.19   ; current from c to e of 0.19 times the voltage b to e
 *     L1 a  b  10u      ; 10 microhenries
 *     C1 b  0  100p     ; 100 picofarads
 *
 * A G element is a voltage controlled current source, and it is what lets a
 * transistor be solved here at all. Its small signal model is a resistance
 * from base to emitter plus a current from collector to emitter proportional
 * to the voltage across that resistance, which is exactly one G and one R.
 *
 * Node '0' (or 'gnd') is ground. Value suffixes are p n u m k M G, and
 * unlike SPICE they are CASE SENSITIVE: 'm' is milli and 'M' is mega, which
 * is what a radio amateur expects when typing 7M1 rather than 7MEG.
 */

/* ---------- complex arithmetic ---------- */

const cx  = (re, im = 0) => ({ re, im });
const add = (a, b) => cx(a.re + b.re, a.im + b.im);
const sub = (a, b) => cx(a.re - b.re, a.im - b.im);
const mul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const div = (a, b) => {
  const d = b.re * b.re + b.im * b.im;
  return cx((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d);
};
const abs = a => Math.hypot(a.re, a.im);
const arg = a => Math.atan2(a.im, a.re);

/* ---------- netlist ---------- */

const SI = { p: 1e-12, n: 1e-9, u: 1e-6, '\u00b5': 1e-6, m: 1e-3, k: 1e3, K: 1e3, M: 1e6, G: 1e9 };

function parseValue(s) {
  const m = /^([-+]?(?:[0-9]*\.)?[0-9]+(?:[eE][-+]?[0-9]+)?)\s*([pnu\u00b5mkKMG])?/.exec(String(s).trim());
  if (!m) throw new Error('cannot parse value: ' + s);
  return parseFloat(m[1]) * (m[2] ? SI[m[2]] : 1);
}

function parseNetlist(text) {
  const elements = [];
  const nodeNames = [];
  const nodeIndex = new Map();

  const nodeOf = name => {
    if (name === '0' || name.toLowerCase() === 'gnd') return -1;
    if (!nodeIndex.has(name)) { nodeIndex.set(name, nodeNames.length); nodeNames.push(name); }
    return nodeIndex.get(name);
  };

  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/[*;#].*$/, '').trim();
    if (!line) continue;
    const tok = line.split(/\s+/);
    if (tok.length < 4) throw new Error('need "name nodeA nodeB value": ' + line);
    const name = tok[0];
    const type = name[0].toUpperCase();
    if (!'RLCVIG'.includes(type)) throw new Error('unknown element type in: ' + name);
    if (type === 'G') {
      // name out+ out- ctrl+ ctrl- gm
      if (tok.length < 6) throw new Error('a G element needs four nodes and a gain: ' + line);
      elements.push({ name, type, a: nodeOf(tok[1]), b: nodeOf(tok[2]),
                      ca: nodeOf(tok[3]), cb: nodeOf(tok[4]), value: parseValue(tok[5]) });
    } else {
      elements.push({ name, type, a: nodeOf(tok[1]), b: nodeOf(tok[2]),
                      value: parseValue(tok[3]) });
    }
  }

  const sources = elements.filter(e => e.type === 'V');
  sources.forEach((e, k) => { e.row = nodeNames.length + k; });
  return { elements, nodeNames, nSources: sources.length };
}

/* ---------- admittance of a two-terminal element ---------- */

function admittance(el, w) {
  switch (el.type) {
    case 'R': return cx(1 / el.value, 0);
    case 'C': return cx(0, w * el.value);
    // At w = 0 an inductor is a short; clamp to a large finite admittance so
    // the matrix stays solvable rather than blowing up at DC.
    case 'L': return w === 0 ? cx(1e12, 0) : cx(0, -1 / (w * el.value));
    default:  return null;
  }
}

/* ---------- solve at one frequency ---------- */

function solveAt(circuit, freqHz) {
  const { elements, nodeNames, nSources } = circuit;
  const n = nodeNames.length;
  const N = n + nSources;
  const w = 2 * Math.PI * freqHz;

  const A = Array.from({ length: N }, () => Array.from({ length: N }, () => cx(0, 0)));
  const z = Array.from({ length: N }, () => cx(0, 0));

  const stampY = (a, b, y) => {
    if (a >= 0) A[a][a] = add(A[a][a], y);
    if (b >= 0) A[b][b] = add(A[b][b], y);
    if (a >= 0 && b >= 0) {
      A[a][b] = sub(A[a][b], y);
      A[b][a] = sub(A[b][a], y);
    }
  };

  for (const el of elements) {
    if (el.type === 'V') {
      const k = el.row;
      if (el.a >= 0) { A[el.a][k] = add(A[el.a][k], cx(1)); A[k][el.a] = add(A[k][el.a], cx(1)); }
      if (el.b >= 0) { A[el.b][k] = sub(A[el.b][k], cx(1)); A[k][el.b] = sub(A[k][el.b], cx(1)); }
      z[k] = cx(el.value, 0);
    } else if (el.type === 'G') {
      // current of gm.(V(ca) - V(cb)) leaves node a and arrives at node b
      const g = cx(el.value, 0);
      if (el.a >= 0 && el.ca >= 0) A[el.a][el.ca] = add(A[el.a][el.ca], g);
      if (el.a >= 0 && el.cb >= 0) A[el.a][el.cb] = sub(A[el.a][el.cb], g);
      if (el.b >= 0 && el.ca >= 0) A[el.b][el.ca] = sub(A[el.b][el.ca], g);
      if (el.b >= 0 && el.cb >= 0) A[el.b][el.cb] = add(A[el.b][el.cb], g);
    } else if (el.type === 'I') {
      // SPICE convention: positive current flows from a, through the source, to b.
      if (el.a >= 0) z[el.a] = sub(z[el.a], cx(el.value, 0));
      if (el.b >= 0) z[el.b] = add(z[el.b], cx(el.value, 0));
    } else {
      stampY(el.a, el.b, admittance(el, w));
    }
  }

  const x = gaussianSolve(A, z);

  const v = {};
  nodeNames.forEach((name, i) => { v[name] = x[i]; });
  v['0'] = cx(0, 0);
  return { f: freqHz, w, v, x, circuit };
}

function gaussianSolve(A, z) {
  const n = z.length;
  for (let i = 0; i < n; i++) A[i] = A[i].concat([z[i]]);

  for (let col = 0; col < n; col++) {
    let piv = col, best = abs(A[col][col]);
    for (let r = col + 1; r < n; r++) {
      const m = abs(A[r][col]);
      if (m > best) { best = m; piv = r; }
    }
    if (best < 1e-300) throw new Error('singular matrix at column ' + col + ' (floating node?)');
    if (piv !== col) { const t = A[piv]; A[piv] = A[col]; A[col] = t; }

    for (let r = col + 1; r < n; r++) {
      const f = div(A[r][col], A[col][col]);
      if (f.re === 0 && f.im === 0) continue;
      for (let c = col; c <= n; c++) A[r][c] = sub(A[r][c], mul(f, A[col][c]));
    }
  }

  const x = new Array(n);
  for (let r = n - 1; r >= 0; r--) {
    let s = A[r][n];
    for (let c = r + 1; c < n; c++) s = sub(s, mul(A[r][c], x[c]));
    x[r] = div(s, A[r][r]);
  }
  return x;
}

/* ---------- reading answers out of a solution ---------- */

const byName = (circuit, name) => {
  const el = circuit.elements.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (!el) throw new Error('no element named ' + name);
  return el;
};

const nodeV = (sol, name) => sol.v[name] ?? cx(0, 0);

/** Voltage across an element, a-terminal relative to b-terminal. */
function voltageAcross(sol, name) {
  const el = byName(sol.circuit, name);
  const va = el.a >= 0 ? sol.x[el.a] : cx(0, 0);
  const vb = el.b >= 0 ? sol.x[el.b] : cx(0, 0);
  return sub(va, vb);
}

/** Current through a passive element, flowing from its a-terminal to its b-terminal. */
function currentThrough(sol, name) {
  const el = byName(sol.circuit, name);
  if (el.type === 'V') return sol.x[el.row];
  if (el.type === 'I') return cx(el.value, 0);
  if (el.type === 'G') {
    const va = el.ca >= 0 ? sol.x[el.ca] : cx(0, 0);
    const vb = el.cb >= 0 ? sol.x[el.cb] : cx(0, 0);
    return mul(sub(va, vb), cx(el.value, 0));
  }
  return mul(voltageAcross(sol, name), admittance(el, sol.w));
}

/** Frequency sweep. Returns an array of solutions. */
function sweep(circuit, fStart, fStop, points = 400, log = true) {
  const out = [];
  for (let i = 0; i < points; i++) {
    const t = points === 1 ? 0 : i / (points - 1);
    const f = log
      ? fStart * Math.pow(fStop / fStart, t)
      : fStart + (fStop - fStart) * t;
    out.push(solveAt(circuit, f));
  }
  return out;
}

const API = { cx, add, sub, mul, div, abs, arg, parseValue, parseNetlist,

if (typeof window !== 'undefined') window.MNA = API;
})();

/*
 * dsp.js - sampling, quantisation and the Fourier transform.
 *
 * The second engine. Where mna.js answers "what does this circuit do at this
 * frequency", this one answers "what does this signal look like once it has
 * been sampled, and what is in it". Between them they cover most of the
 * technical syllabus: 2F digital signals, 2I amplifier classes, and the whole
 * of section 3 from modulation through mixing to demodulation.
 *
 * Nothing here is approximate for the sake of the display. The alias really
 * is computed by sampling the signal and transforming the result, so what
 * appears on the screen is what an ADC would actually produce.

/* ---------- Fourier transform ---------- */

/**
 * In place radix-2 FFT. re and im are Float64Array of the same length, which
 * must be a power of two. Decimation in time, with the usual bit reversal
 * first so the butterflies can run in order.
 */
function fft(re, im) {
  const n = re.length;
  if (n <= 1) return;
  if (n & (n - 1)) throw new Error('fft length must be a power of two, got ' + n);

  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }

  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {

        const br = re[i + k + len / 2], bi = im[i + k + len / 2];
        const tr = br * cr - bi * ci, ti = br * ci + bi * cr;
        re[i + k] = ar + tr; im[i + k] = ai + ti;
        re[i + k + len / 2] = ar - tr; im[i + k + len / 2] = ai - ti;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr;
        cr = ncr;
      }
    }

function hann(n) {

  return w;

 * Magnitude spectrum of a real signal, in dB relative to full scale.
 * Returns { freq: Float64Array, db: Float64Array } over 0 .. fs/2.

  const re = new Float64Array(n), im = new Float64Array(n);
  const w = opts.window === false ? null : hann(n);
  let coherentGain = 0;
  for (let i = 0; i < n; i++) {
    const g = w ? w[i] : 1;
    re[i] = samples[i] * g;
    coherentGain += g;
  }

  const freq = new Float64Array(half), db = new Float64Array(half);

 * Where a tone actually appears once sampled at fs.
 *
 * Fold f into 0 .. fs/2. Below the Nyquist frequency the answer is f itself.
 * Above it, the tone comes back somewhere else entirely, and that somewhere
 * is what the syllabus calls a false image.

 * The residue is the quantisation error the syllabus asks about, and it sets
 * the noise floor you can see on the spectrum.

  for (let i = 0; i < x.length; i++) {
    out[i] = Math.max(-1, Math.min(1, Math.round(x[i] / step) * step));

 * Worth showing because it says plainly what another bit buys you.

(function () {
/*
 * dc.js - operating points, load lines and conduction angle.
 *
 * The third engine. mna.js answers what a linear circuit does at a frequency,
 * dsp.js answers what a signal contains. This one answers where a device sits
 * before any signal arrives, and what happens to a signal once the device
 * stops being linear.
 *
 * That second half is what makes amplifier classes work. A class of operation
 * is nothing more than a choice of where to bias the device, and everything
 * else follows from the fraction of the cycle it conducts for. Rather than
 * quoting the textbook efficiencies, they are derived here from the Fourier
 * coefficients of the truncated sine the transistor actually passes, so the
 * numbers on the screen come out of the model instead of a table.
 */

/* ---------- diode ---------- */

/** Shockley diode current for an applied voltage. */
function diodeCurrent(v, opts) {
  opts = opts || {};
  const Is = opts.Is || 1e-14;        // saturation current
  const nVt = (opts.n || 1.0) * 0.02585;
  const Iz = opts.zener;              // reverse breakdown voltage, if any
  if (Iz && v < -Iz) {
    // past the knee a Zener holds its voltage, so current rises steeply
    return -(Math.exp((-v - Iz) / 0.02) - 1) * 1e-6;
  }
  return Is * (Math.exp(v / nVt) - 1);
}

/** Forward voltage for a wanted current, found by bisection on the curve. */
function diodeVoltage(i, opts) {
  let lo = 0, hi = 2;
  for (let k = 0; k < 60; k++) {
    const mid = (lo + hi) / 2;
    if (diodeCurrent(mid, opts) < i) lo = mid; else hi = mid;
  }

 * dropped across it is a milliamp or so through the transistor. Its two ends
 * are the supply voltage with no current, and the supply divided by the
 * resistor with no voltage left over.

 * Clipped at both ends: a transistor cannot pass more than the load allows,

 * which conducts for the whole cycle, and 0 sits at cut off, which conducts
 * for half of it. drive is the peak of the input relative to that range.

    out[i] = Math.max(0, v + 0.5);      // the device cannot pass negative current

  return out;
}

 * furniture a bench keeps needing: a shaded band (half-power points), dashed
 * markers, and a draggable cursor. Colours come from CSS custom properties so
 * the plot follows the page theme without the caller thinking about it.

 * spec = {
 *   xRange: [a, b], xUnit: 'Hz',
 *   left:  { max, unit, sig },            // 0..max
 *   right: { min, max, fmt },             // optional second axis
 *   traces: [{ pts:[{x,y}], axis:'left'|'right', colour, fill }],
 *   bands:  [{ from, to, colour }],

  // clears it, and must not wipe what the first one drew. The first of a pair

  }
  for (let i = 0; i <= 4; i++) {
    const v = xa + (xb - xa) * i / 4, x = Math.round(X(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, PAD.t + yOff); ctx.lineTo(x, PAD.t + yOff + H); ctx.stroke();
    if (!spec.hideX) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(spec.xFmt(v), x, PAD.t + yOff + H + 9);
    }
  }

  /* shaded bands, behind everything */
  for (const b of (spec.bands || [])) {
    if (b.to < xa || b.from > xb) continue;
    ctx.fillStyle = b.colour;
    ctx.globalAlpha = 0.07;
    const a = Math.max(X(b.from), PAD.l), c = Math.min(X(b.to), PAD.l + W);
    ctx.fillRect(a, PAD.t + yOff, c - a, H);
    ctx.globalAlpha = 1;
  }

  /* dashed markers */
  ctx.setLineDash([3, 3]);
  for (const m of (spec.marks || [])) {
    if (m.x < xa || m.x > xb) continue;
    ctx.strokeStyle = m.colour;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X(m.x), PAD.t + yOff); ctx.lineTo(X(m.x), PAD.t + yOff + H);
    ctx.stroke();
  }

  // free text pinned to a point on the plot, for naming one curve in a family
  // where a legend entry would have to name them all
  for (const l of (spec.labels || [])) {
    if (l.x < xa || l.x > xb) continue;
    const y = (l.axis === 'right' ? YR : YL)(l.y);
    if (y < PAD.t + yOff - 2 || y > PAD.t + yOff + H + 2) continue;
    ctx.fillStyle = l.colour;
    ctx.font = '11px ' + font;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(l.text, X(l.x), y - 3);
  }
  ctx.setLineDash([]);

  /* traces, filled ones first so lines stay on top */
  for (const tr of spec.traces) {
    if (!tr.fill || !tr.pts.length) continue;
    ctx.beginPath();
    const base = Math.min(PAD.t + yOff + H, Math.max(PAD.t + yOff, YL(lmin)));
    ctx.moveTo(X(tr.pts[0].x), base);
    for (const p of tr.pts) ctx.lineTo(X(p.x), Y(p.y, tr.axis));
    ctx.lineTo(X(tr.pts[tr.pts.length - 1].x), base);
    ctx.closePath();
    ctx.fillStyle = tr.fill;
    ctx.fill();
  }
  for (const tr of spec.traces) {
    if (!tr.pts.length) continue;
    ctx.strokeStyle = tr.colour;
    ctx.lineWidth = tr.width || 2.2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    tr.pts.forEach((p, i) => {
      const x = X(p.x), y = Y(p.y, tr.axis);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  }

  /* cursor */
  const c = spec.cursor;
  if (c && c.x >= xa && c.x <= xb) {
    ctx.strokeStyle = c.colour;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(X(c.x), PAD.t + yOff); ctx.lineTo(X(c.x), PAD.t + yOff + H);
    ctx.stroke();
    if (c.dot) {
      ctx.fillStyle = c.colour;
      ctx.beginPath();
      ctx.arc(X(c.x), Y(c.dot.y, c.dot.axis), 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = t.surface || '#fff';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    if (c.label) {
      ctx.fillStyle = t.soft || '#666';
      ctx.font = '600 11px ' + font;
      const nearRight = (xb - c.x) < (xb - xa) * 0.18;
      ctx.textAlign = nearRight ? 'right' : 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(c.label, X(c.x) + (nearRight ? -8 : 8), PAD.t + yOff + 4);
    }
  }
}

/** Map a pointer event to a 0..1 position across the plotting area. */
function cursorFraction(canvas, ev) {
  const r = canvas.getBoundingClientRect();
  const f = (ev.clientX - r.left - PAD.l) / (r.width - PAD.l - PAD.r);
  return Math.min(1, Math.max(0, f));
}

/** Map a value on the left axis to a y pixel, for callers drawing extras. */
function leftY(canvas, spec, v) {
  const H = canvas.clientHeight - PAD.t - PAD.b;
  const lmin = spec.left.min || 0;
  return PAD.t + H * (1 - (v - lmin) / (spec.left.max - lmin));
}

/** Map a value on the x axis to an x pixel. */
function xAt(canvas, xRange, v) {
  const W = canvas.clientWidth - PAD.l - PAD.r;
  return PAD.l + W * (v - xRange[0]) / (xRange[1] - xRange[0]);
}

const API = { draw, cursorFraction, leftY, xAt, PAD };
if (typeof window !== 'undefined') window.Plot = API;
})();

/* ---- engine/schematic.js ---- */
(function () {
/*
 * schematic.js - draw a circuit and annotate it from a live solution.
 *
 * A bench needs the diagram itself to move, not a static picture beside a
 * graph. This takes a layout (positions and orientations on a coarse grid)
 * and draws it with the symbols the RSGB specification actually prints, then
 * writes live values onto the components and can highlight whichever part of
 * the circuit the current explanation is talking about.
 *
 * Symbols follow UK/IEC practice, so a resistor is a plain rectangle rather
 * than the American zigzag.
 *
 * Layout format:
 *   {
 *     w: 300, h: 120,                       // logical drawing size
 *     wires: [[x1,y1,x2,y2], ...],
 *     grounds: [[x,y], ...],
 *     elements: [
 *       { name:'R1', type:'R', at:[60,20], rot:0, label:'R', anchor:'above' }
 *     ]
 *   }
 * rot is degrees clockwise; 0 runs left to right, 90 runs top to bottom.
 */

const BODY = 26;   // length of the symbol body along its axis
const SPAN = 60;   // total length including both leads

function rotated(ctx, x, y, deg, fn) {
  ctx.save();
  ctx.translate(x, y);
  if (deg) ctx.rotate(deg * Math.PI / 180);
  fn();
  ctx.restore();
}

/* ---- symbol bodies, drawn centred on the origin along the x axis ---- */

const SYMBOL = {
  R(ctx) {
    const h = 11;
    ctx.beginPath();
    ctx.rect(-BODY / 2, -h / 2, BODY, h);
    ctx.fillStyle = ctx._surface;
    ctx.fill();
    ctx.stroke();
    lead(ctx, -SPAN / 2, -BODY / 2);
    lead(ctx, BODY / 2, SPAN / 2);
  },

  C(ctx) {
    const h = 20, gap = 4;
    ctx.beginPath();
    ctx.moveTo(-gap, -h / 2); ctx.lineTo(-gap, h / 2);
    ctx.moveTo(gap, -h / 2); ctx.lineTo(gap, h / 2);
    ctx.stroke();
    lead(ctx, -SPAN / 2, -gap);
    lead(ctx, gap, SPAN / 2);
  },

  L(ctx) {
    // four semicircular humps, the usual UK coil
    const n = 4, r = BODY / (2 * n);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      ctx.arc(-BODY / 2 + r * (2 * i + 1), 0, r, Math.PI, 0, false);
    }
    ctx.stroke();
    lead(ctx, -SPAN / 2, -BODY / 2);
    lead(ctx, BODY / 2, SPAN / 2);
  },

  /* Diode: triangle pointing the way conventional current flows, then the bar
   * it cannot get past in the other direction. */
  // A Zener carries the bent bar that says it is meant to break down, and a
  // varicap a pair of plates that say it is meant to be used as a capacitor.
  // Drawn as an ordinary diode, neither reads as the device it is.
  DZ(ctx) {
    const h = 9, w = 9;
    ctx.beginPath();
    ctx.moveTo(-w, -h); ctx.lineTo(w, 0); ctx.lineTo(-w, h);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w - 4, -h); ctx.lineTo(w, -h); ctx.lineTo(w, h);
    ctx.lineTo(w + 4, h);
    ctx.stroke();
    lead(ctx, -SPAN / 2, -w);
    lead(ctx, w, SPAN / 2);
  },

  DV(ctx) {
    const h = 9, w = 7;
    ctx.beginPath();
    ctx.moveTo(-w - 4, -h); ctx.lineTo(w - 4, 0); ctx.lineTo(-w - 4, h);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w - 4, -h); ctx.lineTo(w - 4, h);
    ctx.moveTo(w + 1, -h); ctx.lineTo(w + 1, h);
    ctx.stroke();
    lead(ctx, -SPAN / 2, -w - 4);
    lead(ctx, w + 1, SPAN / 2);
  },

  D(ctx) {
    const h = 9, w = 9;
    ctx.beginPath();
    ctx.moveTo(-w, -h); ctx.lineTo(w, 0); ctx.lineTo(-w, h);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w, -h); ctx.lineTo(w, h);
    ctx.stroke();
    lead(ctx, -SPAN / 2, -w);
    lead(ctx, w, SPAN / 2);
  },

  /*
   * NPN transistor. Three terminals rather than two, so it does not follow the
   * along-the-axis rule the passives use. Relative to its centre: base out to
   * the left, collector up and right, emitter down and right. The RSGB symbol
   * table notes the enclosing circle is optional; it is drawn here because it
   * makes the device stand out among the passives.
   */
  Q(ctx) {
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.stroke();
    // the base bar
    ctx.beginPath();
    ctx.moveTo(-4, -13); ctx.lineTo(-4, 13);
    ctx.stroke();
    // base lead
    ctx.beginPath();
    ctx.moveTo(-30, 0); ctx.lineTo(-4, 0);
    ctx.stroke();
    // collector
    ctx.beginPath();
    ctx.moveTo(-4, -8); ctx.lineTo(12, -20); ctx.lineTo(12, -32);
    ctx.stroke();
    // emitter, with the arrow that says NPN
    ctx.beginPath();
    ctx.moveTo(-4, 8); ctx.lineTo(12, 20); ctx.lineTo(12, 32);
    ctx.stroke();
    const ax = 5.5, ay = 14.6, dx = 12 - -4, dy = 20 - 8;
    const len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    ctx.beginPath();
    ctx.moveTo(ax + ux * 6, ay + uy * 6);
    ctx.lineTo(ax - uy * 3.4, ay + ux * 3.4);
    ctx.lineTo(ax + uy * 3.4, ay - ux * 3.4);
    ctx.closePath();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
  },

  V(ctx) {
    const r = 13;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = ctx._surface;
    ctx.fill();
    ctx.stroke();
    // a small sine inside marks it as an AC source
    ctx.beginPath();
    for (let i = -6; i <= 6; i++) {
      const y = -Math.sin(i / 6 * Math.PI) * 4.5;
      i === -6 ? ctx.moveTo(i, y) : ctx.lineTo(i, y);
    }
    ctx.stroke();
    lead(ctx, -SPAN / 2, -r);
    lead(ctx, r, SPAN / 2);
  }
};

function lead(ctx, from, to) {
  ctx.beginPath();
  ctx.moveTo(from, 0);
  ctx.lineTo(to, 0);
  ctx.stroke();
}

function ground(ctx, x, y, colour) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = colour;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 7);
  ctx.stroke();
  for (let i = 0; i < 3; i++) {
    const w = 11 - i * 3.5;
    ctx.beginPath();
    ctx.moveTo(-w, 7 + i * 4); ctx.lineTo(w, 7 + i * 4);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * Draw a layout.
 * opts: { tokens, labels:{name:text}, highlight:Set<name>, title }
 */
function draw(canvas, layout, opts) {
  opts = opts || {};
  const t = opts.tokens || {};
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth;
  const cssH = canvas.clientHeight;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  // fit the logical drawing into the canvas with a margin
  const pad = 16;
  const scale = Math.min((cssW - pad * 2) / layout.w, (cssH - pad * 2) / layout.h);
  const ox = (cssW - layout.w * scale) / 2;
  const oy = (cssH - layout.h * scale) / 2;
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);

  ctx._surface = t.surface || '#fff';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // wires first, so symbol bodies paint over their ends
  ctx.strokeStyle = t.wire || '#444';
  ctx.lineWidth = 1.6;
  for (const [x1, y1, x2, y2] of (layout.wires || [])) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  for (const [x, y] of (layout.grounds || [])) ground(ctx, x, y, t.wire || '#444');

  // Junction dots wherever three or more conductors meet. Component leads
  // count as conductors, otherwise a T formed by two wires and one component
  // terminal draws no dot and the circuit reads as a crossing.
  const ends = {};
  const bump = (x, y) => { const k = x + ',' + y; ends[k] = (ends[k] || 0) + 1; };
  for (const [x1, y1, x2, y2] of (layout.wires || [])) { bump(x1, y1); bump(x2, y2); }
  for (const el of layout.elements) {
    if (el.type === 'Q') continue;          // three terminals, not two
    const rad = (el.rot || 0) * Math.PI / 180;
    const dx = Math.round(Math.cos(rad) * SPAN / 2);
    const dy = Math.round(Math.sin(rad) * SPAN / 2);
    bump(el.at[0] - dx, el.at[1] - dy);
    bump(el.at[0] + dx, el.at[1] + dy);
  }
  ctx.fillStyle = t.wire || '#444';
  for (const k in ends) {
    if (ends[k] < 3) continue;
    const [x, y] = k.split(',').map(Number);
    ctx.beginPath();
    ctx.arc(x, y, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // labelled terminals, e.g. the output of a filter
  for (const term of (layout.terminals || [])) {
    ctx.fillStyle = t.wire || '#444';
    ctx.beginPath();
    ctx.arc(term.at[0], term.at[1], 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = t.soft || '#666';
    ctx.font = '600 10.5px ' + (t.font || 'sans-serif');
    ctx.textAlign = term.align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(term.label, term.at[0] + (term.align === 'right' ? -8 : 8), term.at[1]);
  }

  for (const el of layout.elements) {
    const hot = opts.highlight && opts.highlight.has(el.name);
    const colour = hot ? (t.marker || '#a02') : (t.wire || '#444');
    ctx.strokeStyle = colour;
    ctx.lineWidth = hot ? 2.4 : 1.6;
    rotated(ctx, el.at[0], el.at[1], el.rot || 0, () => {
      (SYMBOL[el.type] || SYMBOL.R)(ctx);
    });

    // labels stay upright whatever the symbol orientation
    const label = el.label || el.name;
    const value = opts.labels ? opts.labels[el.name] : null;
    if (label || value) {
      const vertical = (el.rot || 0) % 180 !== 0;
      const leftOf = el.labelAt === 'left';
      ctx.fillStyle = hot ? colour : (t.ink || '#111');
      ctx.font = (hot ? '600 ' : '') + '11px ' + (t.font || 'sans-serif');
      ctx.textAlign = vertical ? (leftOf ? 'right' : 'left') : 'center';
      ctx.textBaseline = vertical ? 'middle' : 'bottom';
      const lx = el.at[0] + (vertical ? (leftOf ? -20 : 20) : 0);
      const ly = el.at[1] + (vertical ? 0 : -18);
      ctx.fillText(label, lx, ly);
      if (value) {
        ctx.fillStyle = hot ? colour : (t.soft || '#666');
        ctx.font = '10.5px ' + (t.mono || 'monospace');
        ctx.fillText(value, lx, ly + (vertical ? 13 : 12));
      }
    }
  }

  // charge last, so it reads on top of the wires and the component bodies
  if (opts.flow && typeof window !== 'undefined' && window.Flow) {
    window.Flow.draw(ctx, layout, opts.flow, SPAN);
  }
}

const API = { draw, SPAN, BODY };
if (typeof window !== 'undefined') window.Schematic = API;
})();

/* ---- engine/flow.js ---- */
(function () {
/*
 * flow.js - animated charge movement over a schematic.
 *
 * Dots on the wires so you can see where the current goes. Showing current as
 * moving charge is a long standing convention in circuit teaching tools; this
 * is written from our own solver and no other implementation was consulted.
 *
 * We solve a phasor rather than stepping a time domain simulation, so the
 * instantaneous current in any branch is just
 *
 *     i(t) = |I| cos(wt + arg I)
 *
 * and the dots move with it. That gets one thing right that a streaming
 * animation gets wrong: on AC the charge does not travel anywhere, it sloshes
 * back and forth. It also makes phase visible. In a series circuit every dot
 * moves together. In a parallel tuned circuit the L and C dots move in
 * opposite directions, which is the circulating current the syllabus talks
 * about and is hard to picture from a page.
 *
 * Positions come from integrating the current, so the excursion is
 * proportional to |I| / w and peaks a quarter cycle after the current does.
 * The scale is arbitrary and chosen to be visible: what carries meaning is
 * the relative size between branches and the relative timing.
 */

const SPACING = 17;      // gap between dots, in layout units
const MAX_SWING = 15;    // largest excursion drawn, in layout units

function magOf(c) { return c ? Math.hypot(c.re, c.im) : 0; }
function argOf(c) { return c ? Math.atan2(c.im, c.re) : 0; }

/**
 * Dots along one straight run.
 * offset shifts them along the run; intensity 0..1 sets size and opacity.
 */
function dotsAlong(ctx, x1, y1, x2, y2, offset, intensity, colour) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 1 || intensity <= 0.01) return;
  const ux = dx / len, uy = dy / len;

  ctx.fillStyle = colour;
  ctx.globalAlpha = 0.35 + 0.55 * intensity;
  const r = 1.6 + 1.5 * intensity;

  // start below zero so a dot is always entering the run
  let s = ((offset % SPACING) + SPACING) % SPACING - SPACING;
  for (; s < len; s += SPACING) {
    if (s < 0) continue;
    ctx.beginPath();
    ctx.arc(x1 + ux * s, y1 + uy * s, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** Endpoints of an element, given its centre, rotation and span. */
function endpoints(el, span) {
  const rad = (el.rot || 0) * Math.PI / 180;
  const dx = Math.cos(rad) * span / 2, dy = Math.sin(rad) * span / 2;
  return [el.at[0] - dx, el.at[1] - dy, el.at[0] + dx, el.at[1] + dy];
}

/**
 * flow = {
 *   phase,                  // wt, advanced by the caller
 *   currents: { name: {re,im} },
 *   iMax,                   // largest |I| in the circuit, for scaling
 *   colour
 * }
 * A wire carries the current of whichever element the layout names in its
 * fifth slot: [x1, y1, x2, y2, 'R1']. Positive runs from the first point to
 * the second, so a wire on the return leg names the element and is drawn
 * with its endpoints in the direction the current actually flows.
 */
function draw(ctx, layout, flow, span) {
  if (!flow || !flow.iMax) return;
  const swing = name => {
    const I = flow.currents[name];
    const m = magOf(I) / flow.iMax;
    if (!isFinite(m) || m <= 0) return null;
    /*
     * Currents in one circuit can differ by four orders of magnitude: a base
     * carries microamps while its collector carries hundreds of milliamps.
     * Scaling the movement linearly against the largest makes every other
     * branch sit perfectly still, which reads as a broken animation rather
     * than as a small current. Compressing the scale keeps the ordering
     * visible, so a smaller current still moves and still moves less.
     */
    const shown = Math.pow(m, 0.32);
    // integrating cos gives sin, so the charge lags the current by 90 degrees
    return { off: MAX_SWING * shown * Math.sin(flow.phase + argOf(I)),
             intensity: Math.max(0.18, Math.min(1, shown)) };
  };

  for (const el of layout.elements) {
    if (el.type === 'V') continue;          // the source body is not a wire run
    // a coupling capacitor is a short to the signal and so is absent from the
    // netlist, but it still carries a current, named here by el.flow
    const s = swing(el.flow || el.name);
    if (!s) continue;
    const [x1, y1, x2, y2] = endpoints(el, span);
    dotsAlong(ctx, x1, y1, x2, y2, s.off, s.intensity, flow.colour);
  }

  for (const w of (layout.wires || [])) {
    if (w.length < 5) continue;
    const s = swing(w[4]);
    if (!s) continue;
    dotsAlong(ctx, w[0], w[1], w[2], w[3], s.off, s.intensity, flow.colour);
  }
}

const API = { draw, magOf, argOf, SPACING, MAX_SWING };
if (typeof window !== 'undefined') window.Flow = API;
})();


/* ============ bench content ============ */
/*
 * content/2H.js - Tuned circuits and resonance.
 *
 * One bench per lettered syllabus group, written to be read start to finish
 * rather than dipped into like a checklist. Each section opens by picking up
 * where the last one left off. The item code sits quietly above the heading
 * so a candidate can find what they need, but it is not what leads.
 *
 * Levels are a facet within the bench. 2H has no Foundation content: the
 * syllabus does not teach tuned circuits until Intermediate.
 *
 * Headlines come from content/descriptions.json and are our own wording. The
 * RSGB owns the learning objectives, so nothing here is copied from them.
 *
 * The fifth entry on a wire names the element whose current flows along it,
 * in the direction the wire is written. That is what the charge animation
 * follows.
 */

// The solver is a global; panels get it through their context, but these
// file level helpers reach for it directly.
const M = window.MNA;
// the equation blocks below format numbers directly, so pull these in here
const { eng, trim, sci } = window.Fmt;

function probeAt(spec, f) {
  const sol = M.solveAt(spec.circuit, f);
  const I = M.currentThrough(sol, 'R1');
  const out = { mag: M.abs(I), ph: M.arg(I) * 180 / Math.PI };
  try { out.vl = M.abs(M.voltageAcross(sol, 'L1')); } catch (e) { out.vl = 0; }
  return out;
}

const usesBigR = p =>
  p.item.panel === 'filter' && (p.topology === 'lowpass' || p.topology === 'highpass');

const BENCH = {
  group: '2H',
  title: 'Tuned circuits and resonance',
  pageTitle: 'Tuned Circuits Bench',
  levels: ['intermediate', 'full'],
  circuitBased: true,

  /** Every circuit this bench draws, for the layout checker. */
  allLayouts: () => {
    const v = { R: '5.477', L: '14.14u', C: '141.4p', R2: '548' };
    // the netlist goes with the drawing, so that the checkers can trace every
    // conductor back to a current something actually solves for
    return Object.keys(BENCH.circuits).map(k => {
      const c = BENCH.circuits[k](v);
      return { name: k, layout: c.layout, netlist: c.netlist };
    });
  },
  bank: {
    url: 'https://rsgb.services/public/exams/eqdb/',
    topic: '2H - Tuned Circuits and resonance',
    note: 'Full level only. Choose the topic from the Filter by Topic list.'
  },

  /** Everything the panels and the working blocks read, from R, L and C. */
  derive: (v) => {
    const { R, L, C } = v;
    const f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
    const Q = (1 / R) * Math.sqrt(L / C);
    const Z0 = Math.sqrt(L / C);
    const k = Math.sqrt(1 + 1 / (4 * Q * Q));
    return { R, L, C, f0, Q, Z0, BW: f0 / Q,
             fLo: f0 * (k - 1 / (2 * Q)), fHi: f0 * (k + 1 / (2 * Q)) };
  },

  /* Words this bench introduces, defined where they are first used. */
  terms: {
    'reactance': 'How hard a coil or a capacitor pushes back against an alternating current, measured in ohms like resistance but changing with frequency.',
    'resonance': 'The one frequency at which the reactance of the coil and of the capacitor are equal, so they cancel each other.',
    'tuned circuit': 'A coil and a capacitor connected together, which together favour one frequency over all others.',
    'impedance': 'The total opposition a circuit offers to an alternating current, combining resistance and reactance.',
    'circulating current': 'The current that flows round and round between the coil and the capacitor of a parallel tuned circuit without being drawn from the source.',
    'bandwidth': 'The width of the band of frequencies a tuned circuit accepts, measured between the half power points.',
    'half power point': 'A frequency either side of resonance where the current has fallen to 0.707 of its peak, which is half the power.',
    'Q': 'The centre frequency divided by the bandwidth. It says how sharp the circuit is, and it is also how many times the voltage inside it exceeds the voltage applied.',
    'selectivity': 'How well a circuit picks out one frequency and rejects its neighbours.',
    'dynamic resistance': 'The purely resistive impedance a parallel tuned circuit presents at resonance, once the loss in the coil is allowed for. Also called dynamic impedance.',
    'skin effect': 'The tendency of radio frequency current to travel near the surface of a conductor rather than through all of it, which makes the resistance higher than it is at DC.'
  },

  /* ---- how each panel draws itself ---- */
  panels: {

    reactance(ctx) {
      const { p, d, t, level, values, M, Plot, build, sweep, swatch, ro, Fmt } = ctx;
      const { eng, trim, sci } = Fmt;
      const spec = build('series');
      const fa = d.f0 / 3, fb = d.f0 * 3;
      const n = 320, XL = [], XC = [];
      for (let i = 0; i < n; i++) {
        const f = fa + (fb - fa) * i / (n - 1), w = 2 * Math.PI * f;
        XL.push({ x: f, y: w * d.L });
        XC.push({ x: f, y: Math.min(1 / (w * d.C), d.Z0 * 4) });
      }
      Plot.draw(p.graph, {
        xRange: [fa, fb], xFmt: v => eng(v, 'Hz', 3), tokens: t,
        left: { max: d.Z0 * 3, fmt: v => eng(v, 'Ω', 2) },
        traces: [{ pts: XL, colour: t.trace, axis: 'left' },
                 { pts: XC, colour: t.phase, axis: 'left' }],
        marks: [{ x: d.f0, colour: t.marker }],
        cursor: { x: d.f0, colour: t.marker, label: 'f₀ ' + eng(d.f0, 'Hz', 4) }
      });
      p.legend.innerHTML = swatch(t.trace, 'Reactance of L') + swatch(t.phase, 'Reactance of C') +
                           swatch(t.marker, 'They cross here');
      p.readouts.innerHTML = ro([
        ['Crossing at', eng(d.f0, 'Hz', 5), true],
        ['Reactance there', eng(d.Z0, 'Ω', 4)],
        ['X of L', 'rises with f'],
        ['X of C', 'falls with f']
      ]);
      return spec;
    },

    impedance(ctx) {
      const { p, d, t, level, values, M, Plot, build, sweep, swatch, ro, Fmt } = ctx;
      const { eng, trim, sci } = Fmt;
      const spec = build(p.topology);
      const wide = p.topology === 'parallel';
      const a = Math.max(d.f0 - d.BW * 6, d.f0 * 0.05), b = d.f0 + d.BW * 6;
      const pts = sweep(spec, a, b, 320).map(s => {
        const i = M.abs(M.currentThrough(s.sol, spec.z.i));
        const y = spec.z.mode === 'tank'
          ? M.abs(M.nodeV(s.sol, spec.z.v)) / Math.max(1e-18, i)
          : 1 / Math.max(1e-18, i);
        return { x: s.f, y };
      });
      const peak = Math.max(...pts.map(q => q.y));
      p.legend.innerHTML = swatch(t.trace, wide ? 'Impedance of the tank' : 'Impedance of the loop');
      Plot.draw(p.graph, {
        xRange: [a, b], xFmt: v => eng(v, 'Hz', 4), tokens: t,
        left: { max: peak * 1.1, fmt: v => eng(v, 'Ω', 2) },
        traces: [{ pts, colour: t.trace, fill: t.fill, axis: 'left' }],
        marks: [{ x: d.f0, colour: t.marker }],
        cursor: { x: d.f0, colour: t.marker, label: 'f₀' }
      });
      const at0 = pts.reduce((m, q) => Math.abs(q.x - d.f0) < Math.abs(m.x - d.f0) ? q : m, pts[0]);
      p.readouts.innerHTML = ro([
        ['Connection', wide ? 'Parallel' : 'Series'],
        ['Z at resonance', eng(at0.y, 'Ω', 4), true],
        ['Behaviour', wide ? 'maximum' : 'minimum'],
        ['Resonance', eng(d.f0, 'Hz', 5)]
      ]);
      return spec;
    },

    energy(ctx) {
      const { p, d, t, level, values, M, Plot, build, sweep, swatch, ro, Fmt } = ctx;
      const { eng, trim, sci } = Fmt;
      const spec = build('parallel');
      // natural response of the parallel LCR, integrated directly
      const steps = 900, T = 6 / d.f0, dt = T / steps;
      const eC = [], eL = [], eT = [];
      let v = 1, iL = 0;
      for (let i = 0; i < steps; i++) {
        const tt = i * dt;
        eC.push({ x: tt, y: 0.5 * d.C * v * v });
        eL.push({ x: tt, y: 0.5 * d.L * iL * iL });
        eT.push({ x: tt, y: 0.5 * d.C * v * v + 0.5 * d.L * iL * iL });
        // symplectic update: advance the current first, then use the new
        // value for the voltage. Plain Euler slowly adds energy to an
        // oscillator, which would be an embarrassing thing for this panel to do.
        iL += (v / d.L) * dt;
        v += ((-iL - v / (d.Z0 * d.Q)) / d.C) * dt;
      }
      const peak = 0.5 * d.C;
      Plot.draw(p.graph, {
        xRange: [0, T], xFmt: x => eng(x, 's', 2), tokens: t,
        left: { max: peak * 1.15, fmt: y => eng(y, 'J', 2) },
        traces: [
          { pts: eT, colour: t.faint, width: 1.2, axis: 'left' },
          { pts: eC, colour: t.trace, fill: t.fill, axis: 'left' },
          { pts: eL, colour: t.phase, axis: 'left' }
        ],
        cursor: null
      });
      p.legend.innerHTML = swatch(t.trace, 'Energy in C') + swatch(t.phase, 'Energy in L') +
                           swatch(t.faint, 'Total');
      p.readouts.innerHTML = ro([
        ['Swaps per second', eng(d.f0, 'Hz', 5), true],
        ['Peak energy', eng(peak, 'J', 3)],
        ['Lost through', eng(d.R, 'Ω', 3)],
        ['Cycles shown', '6']
      ]);
      return spec;
    },

    resonance(ctx) {
      const { p, d, t, level, values, M, Plot, build, sweep, swatch, ro, Fmt } = ctx;
      const { eng, trim, sci } = Fmt;
      const spec = build('series');
      const span = Math.min(Math.max(8 * d.BW, d.f0 * 0.02), d.f0 * 1.9);
      const fa = Math.max(d.f0 - span / 2, d.f0 * 0.02), fb = d.f0 + span / 2;
      const s = sweep(spec, fa, fb, 400);
      const peak = Math.max(...s.map(q => q.mag));
      const fc = p.cursor === null ? d.f0 : fa + (fb - fa) * p.cursor;
      const at = probeAt(spec, fc);
      const at0 = probeAt(spec, d.f0);
      Plot.draw(p.graph, {
        xRange: [fa, fb], xFmt: v => eng(v, 'Hz', 4), tokens: t,
        left: { max: peak * 1.08, fmt: v => eng(v, 'A', 3) },
        right: { min: -90, max: 90, fmt: v => Math.round(v) + '°' },
        traces: [
          { pts: s.map(q => ({ x: q.f, y: q.ph * 180 / Math.PI })), colour: t.phase, axis: 'right', width: 1.6 },
          { pts: s.map(q => ({ x: q.f, y: q.mag })), colour: t.trace, fill: t.fill, axis: 'left' }
        ],
        bands: [{ from: d.fLo, to: d.fHi, colour: t.marker }],
        marks: [{ x: d.fLo, colour: t.marker }, { x: d.fHi, colour: t.marker }],
        cursor: { x: fc, colour: t.marker, dot: { y: at.mag, axis: 'left' },
                  label: p.cursor === null ? 'f₀' : eng(fc, 'Hz', 4) }
      });
      p.legend.innerHTML = swatch(t.trace, 'Current') + swatch(t.phase, 'Phase') +
                           swatch(t.marker, 'Half power points');
      const rows = [
        ['Resonance f₀', eng(d.f0, 'Hz', 5)],
        ['Q factor', trim(d.Q, 4)],
        ['Bandwidth', eng(d.BW, 'Hz', 4)]
      ];
      if (level === 'full') rows.push(['V across L at f₀', eng(at0.vl, 'V', 4), true]);
      else rows.push(['Selectivity', 'f₀ / BW = ' + trim(d.Q, 3)]);
      p.readouts.innerHTML = ro(rows);
      return spec;
    },

    filter(ctx) {
      const { p, d, t, level, values, M, Plot, build, sweep, swatch, ro, Fmt } = ctx;
      const { eng, trim, sci } = Fmt;

/* ============ page ============ */
(function () {
  const { eng, sci, trim, round4, logMap, logUnmap } = window.Fmt;
  const M = window.MNA, Plot = window.Plot, Schematic = window.Schematic;
  const $ = id => document.getElementById(id);

  const LEVEL_NAME = { foundation: 'Foundation', intermediate: 'Intermediate', full: 'Full' };
  const values = {};
  BENCH.controls.forEach(c => { values[c.id] = c.start; });

  const params = new URLSearchParams(location.search);
  let level = params.get('level');
  // Anything that goes wrong during the first render happens before there is
  // any way to watch for it, so keep a record that can be read afterwards.
  window.__benchErrors = [];
  window.addEventListener('error', e => {
    window.__benchErrors.push((e.error && e.error.stack) || e.message);
  });

  if (!BENCH.levels.includes(level)) level = BENCH.levels[BENCH.levels.length - 1];

  function setLevel(lv) {
    level = lv;
    const q = new URLSearchParams(location.search);
    q.set('level', lv);
    history.replaceState(null, '', location.pathname + '?' + q + location.hash);
  }

  function tokens() {
    const s = getComputedStyle(document.documentElement);
    const g = n => s.getPropertyValue(n).trim();
    return {
      trace: g('--trace'), fill: g('--trace-fill'), phase: g('--phase'),
      marker: g('--marker'), grid: g('--rule-soft'), wire: g('--wire'),
      ink: g('--ink'), soft: g('--ink-soft'), faint: g('--ink-faint'),
      surface: g('--surface'),
      panelFont: '"Saira Semi Condensed", sans-serif',
      font: '"Saira Semi Condensed", sans-serif',
      mono: '"IBM Plex Mono", monospace'
    };
  }


  /** Quantities derived from the controls. Each bench defines its own. */
  function derived() {
    return BENCH.derive ? BENCH.derive(values) : Object.assign({}, values);
  }

  function build(topology, extra) {
    const v = Object.assign({}, values, extra || {});
    const spec = BENCH.circuits[topology](
      { R: sci(v.R), L: sci(v.L), C: sci(v.C), R2: sci(v.R2 || v.R) });
    spec.circuit = M.parseNetlist(spec.netlist);
    return spec;
  }

  function sweep(spec, fa, fb, n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const f = fa + (fb - fa) * i / (n - 1);
      const sol = M.solveAt(spec.circuit, f);
      let mag, ph;
      if (spec.probe.kind === 'current') {
        const I = M.currentThrough(sol, spec.probe.of);
        mag = M.abs(I); ph = M.arg(I);
      } else {
        const V = M.nodeV(sol, spec.probe.of);
        mag = M.abs(V); ph = M.arg(V);
      }
      out.push({ f, mag, ph, sol });
    }
    return out;
  }

  /* ---- controls ---- */
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let animating = !reduceMotion;
  let phase = 0;

  const rail = $('rail');
  BENCH.controls.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ctrl';
    d.innerHTML =
      '<div class="ctrl-head"><label class="ctrl-name" for="s_' + c.id + '">' + c.label +
      '</label><span class="ctrl-val" id="v_' + c.id + '"></span></div>' +
      '<input type="range" id="s_' + c.id + '" min="0" max="1000" step="1">' +
      (c.desc ? '<p class="ctrl-desc">' + c.desc + '</p>' : '');
    rail.appendChild(d);
    const input = d.querySelector('input');
    input.value = Math.round(c.linear
      ? 1000 * (c.start - c.range[0]) / (c.range[1] - c.range[0])
      : logUnmap(c.start, c.range));
    const toValue = t => c.linear
      ? c.range[0] + (c.range[1] - c.range[0]) * t / 1000
      : logMap(t, c.range);
    input.addEventListener('input', () => {
      values[c.id] = round4(toValue(+input.value));
      renderAll();
    });
  });

  // charge animation control, in the rail beside the component sliders
  (function () {
    const d = document.createElement('div');
    d.className = 'anim';
    d.innerHTML = '<span class="ctrl-name">Charge</span>' +
                  '<button id="animBtn" aria-pressed="' + animating + '">' +
                  (animating ? 'Moving' : 'Still') + '</button>';
    rail.appendChild(d);
    d.querySelector('button').addEventListener('click', e => {
      animating = !animating;
      e.target.setAttribute('aria-pressed', String(animating));
      e.target.textContent = animating ? 'Moving' : 'Still';
      if (animating) { lastTs = 0; requestAnimationFrame(tick); }
      renderAll();
    });
  })();

  /* ---- level switch ---- */
  BENCH.levels.forEach(lv => {
    const b = document.createElement('button');
    b.textContent = LEVEL_NAME[lv];
    b.addEventListener('click', () => { setLevel(lv); renderAll(); });
    $('levels').appendChild(b);
  });

  /* ---- panels ---- */
  const panels = [];
  BENCH.items.forEach(item => {
    const sec = document.createElement('section');
    sec.className = 'item';
    sec.id = 'item-' + item.code;
    const toggleHtml = item.toggle
      ? '<div class="toggle" role="group" aria-label="' + item.toggle.label + '">' +
        item.toggle.options.map(([k, t]) =>
          '<button data-k="' + k + '">' + t + '</button>').join('') + '</div>'
      : '';
    sec.innerHTML =
      '<div class="item-head">' +
        '<div class="item-code"><b>' + item.code + '</b>' +
        '<span>' + item.levels.map(l => LEVEL_NAME[l]).join(' and ') + '</span></div>' +
        '<h2 class="item-heading"></h2>' +
        '<p class="item-lead"></p>' +
        '<div class="presets"></div>' +
        '<p class="item-headline"></p>' +
      '</div>' +
      '<div class="stage" data-stage="' + item.code + '">' +
        (item.noSchematic === true ? '' :
        '<div class="schem"><canvas></canvas><div class="schem-note"></div></div>') +
        '<div class="graph"><canvas></canvas><div class="legend"></div></div>' +
      '</div>' + toggleHtml +
      '<div class="readouts"></div>' +
      '<div class="prose"></div>';
    $('items').appendChild(sec);

    const p = {
      item, sec,
      schem: sec.querySelector('.schem canvas'),
      graphTall: !!item.noSchematic,
      graph: sec.querySelector('.graph canvas'),
      readouts: sec.querySelector('.readouts'),
      prose: sec.querySelector('.prose'),
      legend: sec.querySelector('.legend'),
      schemNote: sec.querySelector('.schem-note'),
      headline: sec.querySelector('.item-headline'),
      lead: sec.querySelector('.item-lead'),
      presets: sec.querySelector('.presets'),
      topology: item.circuit,
      cursor: null
    };
    if (item.toggle) {
      sec.querySelectorAll('.toggle button').forEach(b => {
        b.addEventListener('click', () => { p.topology = b.dataset.k; p.cursor = null; render(p); });
      });
    }
    p.graph.addEventListener('pointerdown', e => {
      p.graph.setPointerCapture(e.pointerId);
      p.cursor = Plot.cursorFraction(p.graph, e); render(p);
    });
    p.graph.addEventListener('pointermove', e => {
      if (!e.buttons) return;
      p.cursor = Plot.cursorFraction(p.graph, e); render(p);
    });
    p.graph.addEventListener('dblclick', () => { p.cursor = null; render(p); });
    panels.push(p);
  });

  function ro(list) {
    // The highlighted figure is the one the panel is built around. That was
    // the convention all along, but nothing on the page said so, so the
    // colour just looked like decoration.
    const rows = list.map(([l, v, hot]) =>
      '<div class="ro' + (hot ? ' hot' : '') + '"><span class="ro-l">' + l +
      '</span><span class="ro-v">' + v + '</span></div>').join('');
    const marked = list.some(r => r[2]);
    return rows + (marked
      ? '<p class="ro-note">The figure in colour is the one this panel is about.</p>'
      : '');
  }


  const swatch = (c, label) =>
    '<span><i style="background:' + c + '"></i>' + label + '</span>';



  function workingBlock(keys, d, note, lead) {
    // An item with no formula still has something to say about why it has
    // none, so the note is shown whether or not there are equations above it.
    if (!keys || !keys.length) {
      return note ? '<p class="work-note">' + note + '</p>' : '';
    }
    const leadHtml = lead ? '<p class="work-lead">' + lead + '</p>' : '';
    const rows = keys.map(k => {
      const f = (BENCH.equations || {})[k];
      if (!f) return '';
      const [sub, out] = f.work(d);
      return '<div class="work-row">' +
        '<div class="work-name">' + f.name +
          '<span class="given ' + (f.given ? 'yes' : 'no') + '">' +
          (f.given ? 'given in the exam' : 'learn this one') + '</span></div>' +
        '<div class="work-eq">' + f.eq + '</div>' +
        '<div class="work-sub">= ' + sub + ' = <span class="work-out">' + out + '</span></div>' +
        '</div>';
    }).join('');
    return leadHtml + '<div class="work">' + rows + '</div>' +
           (note ? '<p class="work-note">' + note + '</p>' : '');
  }


  function render(p) {
    const d = derived(), t = tokens();
    const item = p.item;
    const show = item.levels.includes(level);
    p.sec.hidden = !show;
    if (!show) return;

    const pick = f => typeof f === 'string' ? f : (f && (f[level] || f[item.levels[0]])) || '';
    p.sec.querySelector('.item-heading').textContent = pick(item.heading);
    p.headline.textContent = item.headline[level] || item.headline[item.levels[0]];
    p.lead.textContent = pick(item.lead);
    /*
     * Named settings, so a worked example out of a book can be followed on
     * the bench instead of only described. Each one says where it came from.
     */
    if (p.presets) {
      const list = (item.presets || []).filter(
        ps => !ps.levels || ps.levels.includes(level));
      p.presets.innerHTML = list.map((ps, i) =>
        '<button type="button" class="preset" data-i="' + i + '">' +
        esc(ps.label) + '</button>').join('') +
        (list.length && list[0].note ? '<span class="preset-note">' +
          esc(list[0].note) + '</span>' : '');
      p.presets.hidden = !list.length;
      p.presets.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => applySeed(list[+b.dataset.i].values));
      });
    }
    // the left slot holds a circuit, or a second display, or nothing
    const hideSchem = item.noSchematic === true ||
      (item.noSchematic && typeof item.noSchematic === 'object' && item.noSchematic[level]);
    const stage = p.sec.querySelector('.stage');
    if (stage) stage.classList.toggle('wide', !!hideSchem);
    if (p.schem && p.schem.parentElement) p.schem.parentElement.hidden = !!hideSchem;

    const panelName = typeof item.panel === 'string' ? item.panel : pick(item.panel);
    const stageBox = p.sec.querySelector('.stage');
    if (!panelName) {
      // a prose only item: no instrument, so do not leave an empty frame
      if (stageBox) stageBox.hidden = true;
      p.readouts.innerHTML = '';
      p.flow = null; p.layout = null;
      return finishItem(p, item, d);
    }
    if (stageBox) stageBox.hidden = false;
    const panel = BENCH.panels[panelName];
    if (!panel) throw new Error('no panel named ' + panelName);
    const spec = panel({
      p: p, d: d, t: t, level: level, values: values, item: item,
      M: M, Plot: Plot, Fmt: window.Fmt,
      build: build, sweep: sweep, swatch: swatch, ro: ro
    });

    // currents for the charge animation, taken at whichever frequency this
    // panel is drawing attention to, so the cursor changes what you see
    if (spec.circuit) {
      const sol = M.solveAt(spec.circuit, p.fAnim || d.f0);
      const currents = {};
      for (const el of spec.circuit.elements) {
        if (el.type === 'V') continue;
        currents[el.name] = M.currentThrough(sol, el.name);
      }
      /*
       * Scale the animation to the largest current that is actually drawn.
       * Some of the biggest currents in the circuit are inside the device and
       * never appear on the page: the transistor's controlled source and its
       * own output resistance. Normalising to those left the largest visible
       * branch at a fraction of full swing and made every setting where they
       * dominate look sluggish for no reason the reader could see.
       */
      const shown = new Set();
      const lay = spec.layout;
      if (lay) {
        for (const el of (lay.elements || [])) {
          const nm = el.flow === undefined ? el.name : el.flow;
          if (nm && nm !== '-') shown.add(nm);
        }
        for (const w of (lay.wires || [])) if (w[4] && w[4] !== '-') shown.add(w[4]);
      }
      let iMax = 0;
      for (const nm of Object.keys(currents)) {
        if (shown.size && !shown.has(nm)) continue;
        iMax = Math.max(iMax, M.abs(currents[nm]));
      }
      p.flow = { currents, iMax, colour: t.trace };
    } else {
      p.flow = null;
    }
    p.layout = spec.layout || null;
    if (p.schemNote && p.flow) {
      const f = p.fAnim || d.f0;
      p.schemNote.textContent = animating
        ? 'charge at ' + eng(f, 'Hz', 4) + ', slowed ' +
          Math.round(f / animRate()).toLocaleString('en-GB') + ' times'
        : 'charge held still';
    }
    p.labels = BENCH.labels ? BENCH.labels(p, d, values) : {};
    p.highlight = new Set(Array.isArray(item.highlight)
      ? item.highlight
      : (item.highlight && item.highlight[level]) || []);

    drawSchematic(p);

    finishItem(p, item, d);
  }

  /*
   * Words, working and questions. Split out because a prose only item needs
   * all of this and none of the instrument above it.
   */
  function finishItem(p, item, d) {
    const paras = (item.explain[level] || []).map(x => '<p>' + x + '</p>').join('');
    const keys = (item.formulas && (item.formulas[level] || item.formulas.all)) || [];
    const wk = workingBlock(keys, Object.assign({ Rf: values.R * 100 }, d),
                            item.workNote && item.workNote[level],
                            item.workLead && item.workLead[level]);
    // The working goes above the prose. Watching which term in the equation
    // moves is the lesson; the paragraphs are commentary on it.
    p.prose.innerHTML =
      '<div class="prose-work">' + wk + '</div>' +
      '<div class="prose-text">' + termsBlock(item) + paras + '</div>' +
      '<div class="prose-qs">' + questionsFor(item.code) + '</div>';
    wireQuestions(p.prose);

    if (item.toggle) {
      const box = p.sec.querySelector('.toggle');
      const wanted = item.toggle.levels;
      if (box) box.hidden = !!(wanted && wanted.indexOf(level) < 0);
      p.sec.querySelectorAll('.toggle button').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.k === p.topology)));
    }
  }

  /*
   * Questions are published for Full level only. At Intermediate there is
   * nothing to show, so say so rather than sending the reader to look for a
   * bank that does not exist yet.
   */
  const esc = s => String(s).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function questionsFor(code) {
    if (level !== 'full') {
      return '<div class="qlink"><span>The RSGB has published its question bank for ' +
        'Full level only. Foundation and Intermediate are listed as still to come, so ' +
        'there are no questions to show here yet.</span></div>';
    }
    const qs = QUESTIONS.filter(q => q.code === code);
    if (!qs.length) {
      return '<div class="qlink"><span>No questions in the bank are tagged to this item.</span>' +
        '<a href="' + BENCH.bank.url + '" target="_blank" rel="noopener">Browse the bank</a></div>';
    }
    const body = qs.map((q, i) =>
      '<div class="q" data-answer="' + q.answer + '">' +
        '<p class="q-text">' + esc(q.q) + '</p>' +
        (q.image ? '<img class="q-img" alt="Diagram for question ' + esc(q.ref) +
                   '" src="' + q.image + '">' : '') +
        '<ul class="q-opts">' +
          q.options.map((o, k) =>
            '<li data-k="' + 'ABCD'[k] + '"><span class="k">' + 'ABCD'[k] + '</span>' +
            '<span>' + esc(o) + '</span></li>').join('') +
        '</ul>' +
        '<div class="q-foot"><button type="button">Show answer</button>' +
        '<span class="q-ref">' + esc(q.ref) + '</span></div>' +
        answerBlock(q) +
      '</div>').join('');
    return '<div class="qs"><div class="qs-head">' + qs.length +
      ' question' + (qs.length > 1 ? 's' : '') + ' from the bank for ' + code + '</div>' +
      body +
      '<div class="q-attrib">Questions and diagrams &copy; Radio Society of Great Britain, ' +
      'reproduced unadapted from the published Full level question bank. ' +
      '<a href="' + BENCH.bank.url + '" target="_blank" rel="noopener">Source</a></div></div>';
  }

  /*
   * Showing which option is right teaches very little on its own. What the
   * reader needs is why, and the arithmetic where there is any. This is our
   * own writing: the question and its options are the RSGB's, the reasoning
   * is not.
   */
  function answerBlock(q) {
    const a = (BENCH.answers || {})[q.ref];
    if (!a) return '';
    const work = a.working
      ? '<div class="q-work">' + a.working.map(l => '<div>' + l + '</div>').join('') + '</div>'
      : '';
    const seed = a.seed
      ? '<button type="button" class="q-seed" data-seed="' +
        esc(JSON.stringify(a.seed)) + '">Set the bench to this question</button>'
      : '';
    const note = a.seedNote ? '<p class="work-note">' + a.seedNote + '</p>' : '';
    return '<div class="q-why">' + (a.why ? '<p>' + a.why + '</p>' : '') +
           work + sourceLine(a) + note + seed + '</div>';
  }

  /*
   * Say where the reasoning came from. An answer that appears from nowhere
   * teaches nothing, so each one names the equation it used and links to the
   * section that explains it. Those sections are the ones above on this page.
   */
  function sourceLine(a) {
    if (!a.source) return '';
    const eqs = (a.source.eq || []).map(k => {
      const f = (BENCH.equations || {})[k];
      return f ? '<code>' + f.eq + '</code>' : '';
    }).filter(Boolean);
    const froms = (a.source.from || []).map(code => {
      const it = BENCH.items.find(i => i.code === code);
      if (!it) return '';
      const h = typeof it.heading === 'string' ? it.heading
              : (it.heading && (it.heading[level] || it.heading[it.levels[0]])) || code;
      return '<a href="#item-' + code + '">' + esc(h) + '</a>';
    }).filter(Boolean);
    let body = '';
    if (eqs.length) body += 'Uses ' + eqs.join(' and ');
    if (froms.length) body += (body ? ', explained in ' : 'Explained in ') + froms.join(' and ');
    if (a.source.note) body += '. ' + a.source.note;
    return body ? '<div class="q-src"><b>Where this comes from</b>' + body + '</div>' : '';
  }

  /** Put the sliders where a question's values say, then redraw everything. */
  function applySeed(seed) {
    BENCH.controls.forEach(c => {
      if (!(c.id in seed)) return;
      const v = Math.min(c.range[1], Math.max(c.range[0], seed[c.id]));
      values[c.id] = round4(v);
      const input = $('s_' + c.id);
      if (input) {
        input.value = Math.round(c.linear
          ? 1000 * (v - c.range[0]) / (c.range[1] - c.range[0])
          : logUnmap(v, c.range));
      }
    });
    renderAll();
  }

  function wireQuestions(root) {
    root.querySelectorAll('.q').forEach(q => {
      const btn = q.querySelector('.q-foot button');
      if (!btn) return;
      btn.addEventListener('click', () => {
        const on = q.classList.toggle('shown');
        btn.textContent = on ? 'Hide answer' : 'Show answer';
        q.querySelectorAll('.q-opts li').forEach(li =>
          li.classList.toggle('right', on && li.dataset.k === q.dataset.answer));
      });
      const seedBtn = q.querySelector('.q-seed');
      if (seedBtn) {
        seedBtn.addEventListener('click', () => {
          const seed = JSON.parse(seedBtn.dataset.seed);
          applySeed(seed);
          q.scrollIntoView({ block: 'nearest' });
        });
      }
    });
  }

  /*
   * A word gets defined in the section that first uses it, above the prose
   * rather than in a glossary somewhere else, so nobody has to go looking.
   * The build refuses to ship a bench that uses a term before defining it.
   */
  function termsBlock(item) {
    const list = item.introduces && (item.introduces[level] || []);
    if (!list || !list.length || !BENCH.terms) return '';
    const rows = list.map(k => BENCH.terms[k]
      ? '<div><dt>' + esc(k) + '</dt><dd>' + BENCH.terms[k] + '</dd></div>' : '').join('');
    if (!rows) return '';
    return '<div class="terms"><div class="terms-head">' +
      (list.length > 1 ? 'Words used here' : 'Word used here') +
      '</div><dl>' + rows + '</dl></div>';
  }

  function drawSchematic(p) {
    if (!p.layout || !p.schem) return;
    Schematic.draw(p.schem, p.layout, {
      tokens: tokens(),
      highlight: p.highlight,
      labels: p.labels,
      flow: p.flow ? Object.assign({ phase: phase }, p.flow) : null
    });
  }

  // Only animate what is on screen. Five panels redrawing at 60 frames a
  // second for the sake of one the reader cannot see is wasted battery.
  const onScreen = new Set();
  if (window.IntersectionObserver) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => e.isIntersecting ? onScreen.add(e.target) : onScreen.delete(e.target));
    }, { rootMargin: '100px' });
    panels.forEach(p => io.observe(p.sec));
  } else {
    panels.forEach(p => onScreen.add(p.sec));
  }

  /*
   * Real speed is out of the question: at a few megahertz every dot would be
   * a blur. But holding the rate fixed hides the fact that frequency changed
   * at all, so it follows f gently and is clamped so it stays watchable. The
   * slowdown factor is printed under each circuit, which makes the point that
   * absolute speed here is arbitrary while the relative timing is not.
   */
  const ANIM_BASE = 0.55;                // cycles per second on screen
  function animRate() {
    const d = derived();
    const ref = BENCH.animRef;
    if (!ref || !d.f0) return ANIM_BASE;
    const scale = Math.pow(d.f0 / ref, 0.35);
    return ANIM_BASE * Math.min(2.2, Math.max(0.45, scale));
  }

  let lastTs = 0;
  function tick(ts) {
    if (!animating) return;
    const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
    lastTs = ts || 0;
    phase += dt * 2 * Math.PI * animRate();
    panels.forEach(p => { if (!p.sec.hidden && onScreen.has(p.sec)) drawSchematic(p); });
    requestAnimationFrame(tick);
  }

  function renderAll() {
    const para = xs => (xs || []).map(x => '<p>' + x + '</p>').join('');
    $('intro').innerHTML = para(BENCH.intro && (BENCH.intro[level] || BENCH.intro.all));
    $('outro').innerHTML = para(BENCH.outro && (BENCH.outro[level] || BENCH.outro.all));
    // a dimensionless quantity gets no SI prefix: a bias of -0.25 is not -250 m
    BENCH.controls.forEach(c => {
      $('v_' + c.id).textContent = c.unit ? eng(values[c.id], c.unit, 3) : trim(values[c.id], 3);
    });
    $('levels').querySelectorAll('button').forEach((b, i) =>
      b.setAttribute('aria-pressed', String(BENCH.levels[i] === level)));
    const shown = BENCH.items.filter(i => i.levels.includes(level));
    $('grpItems').textContent = 'RSGB ' + LEVEL_NAME[level] + ', ' +
      shown.length + ' of ' + BENCH.items.length + ' items in this thread';
    // One panel throwing used to take out every item after it, leaving a page
    // of blank frames with nothing to say what had happened. Contain it, and
    // make the failure visible where it happened.
    panels.forEach(p => {
      try {
        render(p);
        if (p.failed) { p.failed.remove(); p.failed = null; }
      } catch (err) {
        console.error('panel for ' + p.item.code + ' failed', err);
        if (!p.failed) {
          p.failed = document.createElement('p');
          p.failed.className = 'panel-failed';
          p.sec.prepend(p.failed);
        }
        p.failed.textContent = 'This panel could not be drawn: ' + err.message;
      }
    });
  }

  $('grpTag').textContent = BENCH.group;
  $('grpTitle').textContent = BENCH.title;
  $('colophon').innerHTML =
    '<span class="home"><a href="../index.html">All the Bench Test pages</a>' +
    ' &middot; built by Ian Henry, G0LFT, ' +
    '<a href="https://g0lft.org/">g0lft.org</a></span>' +
    'Every curve is solved by a general complex nodal analysis engine, verified against ' +
    'closed form results. Circuit symbols follow the RSGB specification. ' +
    'Item wording is our own. Questions are held by the RSGB and used under the terms ' +
    'published with the bank. ' + BENCH.bank.note;

  // Panels are built here, so at load time the browser cannot resolve a
  // #item-... fragment and any jump lands under the sticky rail. Do it once
  // the panels exist. This is the link a question uses to open its own bench.
  function jumpToFragment() {
    const id = (location.hash || '').slice(1);
    if (!id) return;
    const el = document.getElementById(id);
    if (!el || el.hidden) return;
    const rail = document.querySelector('.rail-wrap');
    const clear = (rail ? rail.offsetHeight : 0) + 14;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - clear });
  }

  window.addEventListener('resize', renderAll);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
  renderAll();
  if (animating) requestAnimationFrame(tick);

  // Jump exactly once, and only after layout has settled. Web fonts land after
  // the first paint and reflow every panel, and measuring mid-layout sends the
  // scroll hundreds of pixels wide of the target.
  let jumped = false;
  function jumpOnce() {
    if (jumped) return;
    jumped = true;
    requestAnimationFrame(() => requestAnimationFrame(jumpToFragment));
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { renderAll(); jumpOnce(); });
  }
  setTimeout(jumpOnce, 800);
})();
</script>
